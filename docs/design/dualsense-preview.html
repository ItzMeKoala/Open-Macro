<p class="sub">The same drawing and motion the ReWASD app uses. Connect a controller and press buttons, pull the triggers and move the sticks,

</div>
<div class="bar">
  <span id="pad" class="pill">No controller (press a button on it)</span>
  <span id="name" class="pill">&nbsp;</span>
  <button id="demo">Demo</button>
</div>
<script>
(() => {
  const svg = document.getElementById('dualsense');
  const NS = 'http://www.w3.org/2000/svg';

  // ---- same maths as ArtPartAnimator in ReWASD.Core ----
  const mul = (m, n) => [m[0]*n[0]+m[2]*n[1], m[1]*n[0]+m[3]*n[1], m[0]*n[2]+m[2]*n[3], m[1]*n[2]+m[3]*n[3], m[0]*n[4]+m[2]*n[5]+m[4], m[1]*n[4]+m[3]*n[5]+m[5]];
  const T = (x, y) => [1, 0, 0, 1, x, y], S = (x, y) => [x, 0, 0, y, 0, 0];
  const about = (o, m) => mul(mul(T(o[0], o[1]), m), T(-o[0], -o[1]));
  const spring = (omega, damping) => ({ v: 0, vel: 0, target: 0, omega, damping,
    step(dt) { const n = Math.max(1, Math.ceil(Math.min(dt, .1) / (1/240))), h = Math.min(dt, .1) / n;
      for (let i = 0; i < n; i++) { this.vel += (this.omega*this.omega*(this.target-this.v) - 2*this.damping*this.omega*this.vel) * h; this.v += this.vel*h; } },
    settled() { return Math.abs(this.target - this.v) < .0015 && Math.abs(this.vel) < .01; } });

  const parts = [...svg.querySelectorAll('g[data-button]')].map(g => {
    const num = (k, d) => g.dataset[k] !== undefined ? parseFloat(g.dataset[k]) : d;
    const o = (g.dataset.origin || '0 0').split(' ').map(parseFloat);
    const p = { g, id: g.id, button: g.dataset.button, name: g.dataset.name, motion: g.dataset.anim || 'press', origin: o,
      pressScale: num('pressScale', .94), pressDy: num('pressDy', 1.5), travel: num('travel', 0),
      mover: g.dataset.anim === 'stick' ? g.querySelector('[data-role="move"]') : g,
      glows: [...g.querySelectorAll('[data-fx="glow"]')],
      press: spring(46, .72), analog: spring(40, .92), x: spring(34, .55), y: spring(34, .55), hover: spring(30, 1),
      pressed: false, hold: 0, mouse: false };
    p.glows.forEach(el => el.style.opacity = 0);
    return p;
  });
  const byButton = Object.fromEntries(parts.map(p => [p.button, p]));

  function render(p) {
    const [ox, oy] = [p.origin[0], p.origin[1]]; let m, glow;
    if (p.motion === 'trigger') { const v = p.analog.v;
      m = mul(T(0, p.travel*v), about(p.origin, S(1, 1 - .06*Math.min(1.2, Math.max(0, v))))); glow = Math.min(1, Math.max(0, v)); }
    else if (p.motion === 'stick') { const s = 1 + (p.pressScale-1)*p.press.v;
      m = mul(T(p.x.v*p.travel, p.y.v*p.travel), about(p.origin, S(s, s))); glow = Math.min(1, Math.max(0, p.press.v)); }
    else { const s = 1 + (p.pressScale-1)*p.press.v;
      m = mul(T(0, p.pressDy*p.press.v), about(p.origin, S(s, s))); glow = Math.min(1, Math.max(0, p.press.v)); }
    p.mover.setAttribute('transform', `matrix(${m.join(' ')})`);
    p.glows.forEach(el => { const max = el.dataset.max !== undefined ? parseFloat(el.dataset.max) : 1; el.style.opacity = glow * max; });
  }

  // ---- input: real controller (Gamepad API, standard layout) ----
  const MAP = { 0: 'A', 1: 'B', 2: 'X', 3: 'Y', 4: 'LeftBumper', 5: 'RightBumper', 8: 'View', 9: 'Menu', 10: 'LeftStickClick', 11: 'RightStickClick',
                12: 'DpadUp', 13: 'DpadDown', 14: 'DpadLeft', 15: 'DpadRight', 16: 'Guide' };
  let demo = false, demoT = 0, connected = false;

  function poll(now) {
    const pads = navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : [];
    const gp = pads[0];
    if (gp !== undefined && !demo) {
      if (!connected) { connected = true; const el = document.getElementById('pad'); el.textContent = gp.id.replace(/\(.*\)/, '').trim(); el.classList.add('ok'); }
      gp.buttons.forEach((b, i) => { const p = byButton[MAP[i]]; if (p) setPressed(p, b.pressed); });
      if (gp.buttons[6]) byButton.LeftTrigger.analog.target = gp.buttons[6].value;
      if (gp.buttons[7]) byButton.RightTrigger.analog.target = gp.buttons[7].value;
      const ls = byButton.LeftStickClick, rs = byButton.RightStickClick;
      const dead = v => Math.abs(v) < .06 ? 0 : v;
      setStick(ls, dead(gp.axes[0] || 0), dead(gp.axes[1] || 0));
      setStick(rs, dead(gp.axes[2] || 0), dead(gp.axes[3] || 0));
    }
    if (demo) runDemo(now);
    return gp;
  }
  function setPressed(p, down) { if (down && !p.pressed) p.hold = .075; p.pressed = down; }
  function setStick(p, x, y) { const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; } p.x.target = x; p.y.target = y; }

  function runDemo(now) {
    demoT = now / 1000;
    const seq = ['A','B','X','Y','DpadUp','DpadRight','DpadDown','DpadLeft','LeftBumper','RightBumper','View','Menu','Guide','LeftStickClick','RightStickClick'];
    const i = Math.floor(demoT * 2.2) % seq.length;
    parts.forEach(p => { if (p.motion !== 'trigger') setPressed(p, p.button === seq[i] && (demoT*2.2 % 1) < .7); });
    byButton.LeftTrigger.analog.target = .5 + .5*Math.sin(demoT*1.7);
    byButton.RightTrigger.analog.target = .5 + .5*Math.sin(demoT*1.3 + 1);
    setStick(byButton.LeftStickClick, Math.cos(demoT*1.2), Math.sin(demoT*1.2));
    setStick(byButton.RightStickClick, Math.cos(demoT*.9+2), Math.sin(demoT*1.4));
  }

  // ---- input: mouse / touch ----
  parts.forEach(p => {
    const hit = [...p.g.querySelectorAll('.hit')];
    p.g.classList.add('part');
    hit.forEach(h => {
      h.addEventListener('pointerenter', () => { document.getElementById('name').textContent = p.name; });
      h.addEventListener('pointerleave', () => { document.getElementById('name').innerHTML = '&nbsp;'; });
      h.addEventListener('pointerdown', e => { if (demo) return; p.mouse = true; setPressed(p, true);
        if (p.motion === 'trigger') p.analog.target = 1; h.setPointerCapture(e.pointerId); });
      const up = () => { if (!p.mouse) return; p.mouse = false; setPressed(p, false); if (p.motion === 'trigger') p.analog.target = 0; };
      h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
    });
  });
  document.getElementById('demo').addEventListener('click', e => { demo = !demo; e.target.textContent = demo ? 'Stop demo' : 'Demo';
    if (!demo) { parts.forEach(p => { setPressed(p, false); p.analog.target = 0; p.x.target = p.y.target = 0; }); } });
  if (location.hash === '#demo') { demo = true; document.getElementById('demo').textContent = 'Stop demo'; }

  // ---- frame loop ----
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.1, (now - last) / 1000); last = now;
    poll(now);
    parts.forEach(p => {
      p.hold = Math.max(0, p.hold - dt);
      p.press.target = p.pressed || p.hold > 0 ? 1 : 0;
      p.press.step(dt); p.analog.step(dt); p.x.step(dt); p.y.step(dt);
      render(p);
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
