name: CI

on:
  push:
    branches: ['**']   # every branch, so a change can be checked on Windows and macOS before it is merged
  pull_request:

jobs:
  # The engine, shared view models, Mac front end and tests build and run on both systems.
  # The WPF front end only runs on Windows, but it is compiled on macOS too, so a break shows up everywhere.
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build
        run: dotnet build ReWASD.sln --configuration Release
      - name: Test
        run: dotnet test ReWASD.sln --configuration Release --no-build
      - name: The Windows app opens and stays open
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Loads the real window, so a mistake in the WPF screens (a missing style, a bad binding target) shows up here, not for a user
          $exe = Get-ChildItem src/ReWASD.UI/bin/Release -Recurse -Filter ReWASD.UI.exe | Select-Object -First 1
          $p = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) {
            $log = Join-Path $env:APPDATA 'ReWASD-OpenSource\crash.log'
            if (Test-Path $log) { Get-Content $log -Tail 60 }
            throw "ReWASD.UI.exe closed by itself (exit code $($p.ExitCode))"
          }
          Stop-Process -Id $p.Id -Force

          # And once more straight into the full-screen controller tester, which is only built when it is first shown
          $env:REWASD_START_TESTER = '1'
          $p = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) {
            $log = Join-Path $env:APPDATA 'ReWASD-OpenSource\crash.log'
            if (Test-Path $log) { Get-Content $log -Tail 60 }
            throw "ReWASD.UI.exe closed by itself when opening the tester (exit code $($p.ExitCode))"
          }
          Stop-Process -Id $p.Id -Force

          # And maximised, where the live readings show under the controller
          $env:REWASD_START_TESTER = ''
          $env:REWASD_START_MAXIMIZED = '1'
          $p = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) {
            $log = Join-Path $env:APPDATA 'ReWASD-OpenSource\crash.log'
            if (Test-Path $log) { Get-Content $log -Tail 60 }
            throw "ReWASD.UI.exe closed by itself when maximised (exit code $($p.ExitCode))"
          }
          Stop-Process -Id $p.Id -Force

  package-macos:
    runs-on: macos-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build ReWASD.app
        run: scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ReWASD-macOS
          path: artifacts/macos/**/ReWASD.app
